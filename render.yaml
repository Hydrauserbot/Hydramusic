services:
  - type: web
    name: shruti-music
    env: python
    region: oregon
    plan: free

    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: python3 -m ShrutiMusic

    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13

      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: BOT_TOKEN
        sync: false

      - key: API_KEY
        sync: false

      - key: MONGO_DB_URI
        sync: false

      - key: STRING_SESSION
        sync: false

      - key: OWNER_ID
        value: 7574330905

      - key: OWNER_USERNAME
        value: WTF_WhyMeeh

      - key: BOT_USERNAME
        value: ShrutixMusicBot

      - key: LOG_GROUP_ID
        value: -1002321189618

      - key: SUPPORT_GROUP
        value: https://t.me/ShrutiBotsupport

      - key: SUPPORT_CHANNEL
        value: https://t.me/ShrutiBots

      - key: INSTAGRAM
        value: https://instagram.com/yaduwanshi_nand

      - key: YOUTUBE
        value: https://youtube.com/@NandEditz

      - key: GITHUB
        value: https://github.com/NoxxOP

      - key: DONATE
        value: https://t.me/ShrutiBots/91

      - key: START_IMG_URL
        sync: false
